packages:
  - apps/*
  - packages/*
  - server

# pnpm 11 用 allowBuilds 逐包放行安装脚本（v11 已移除 onlyBuiltDependencies）；
# 未列出的包默认不跑脚本，且 strictDepBuilds 会让 install 直接失败
allowBuilds:
  argon2: true
  electron: true
  esbuild: true
  '@swc/core': true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  electron-winstaller: true

# 全仓唯一版本出处：子包一律写 catalog:，不在各自 package.json 里写版本号
catalog:
  # 语言与工具链
  typescript: ~5.9.3
  ts-loader: ^9.5.0
  eslint: ^10.14.0
  '@eslint/js': ^10.0.0
  typescript-eslint: ^8.72.1
  eslint-plugin-vue: ^10.12.0
  vue-eslint-parser: ^10.4.1
  globals: ^16.0.0
  prettier: ^3.9.0
  eslint-config-prettier: ^10.1.8
  husky: ^9.1.7
  lint-staged: ^17.6.0
  '@commitlint/cli': ^20.5.3
  '@commitlint/config-conventional': ^20.5.3
  '@types/node': ^22.18.0

  # 后端
  '@nestjs/common': ^11.0.1
  '@nestjs/core': ^11.0.1
  '@nestjs/platform-express': ^11.0.1
  '@nestjs/config': ^4.0.4
  '@nestjs/jwt': ^11.0.2
  '@nestjs/swagger': ^11.2.0
  '@nestjs/websockets': ^11.0.1
  '@nestjs/platform-ws': ^11.0.1
  '@nestjs/cli': ^11.0.0
  '@nestjs/testing': ^11.0.1
  '@prisma/client': ^7.8.0
  prisma: ^7.8.0
  '@prisma/adapter-pg': ^7.8.0
  nestjs-zod: ^5.0.0
  zod: ^4.1.0
  argon2: ^0.44.0
  tsx: ^4.23.15
  livekit-server-sdk: ^2.19.2
  ws: ^8.22.0
  '@types/ws': ^8.18.2
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2

  # 前端
  vite: ^7.0.0
  '@vitejs/plugin-vue': ^6.0.0
  vue-tsc: ^3.0.0
  vue: ^3.5.0
  vue-router: ^5.0.0
  pinia: ^3.0.0
  element-plus: ^2.14.0
  tailwindcss: ^4.0.0
  '@tailwindcss/vite': ^4.0.0
  livekit-client: 2.21.0
  react: ^19.0.0
  react-dom: ^19.0.0
  react-router: ^7.0.0
  antd: ^5.29.0
  '@ant-design/v5-patch-for-react-19': ^1.0.3
  '@tanstack/react-query': ^5.0.0
  zustand: ^5.0.0
  recharts: ^3.0.0

  # 桌面端
  electron: ^39.0.0
  electron-vite: ^5.0.0
  electron-builder: ^26.0.0
  electron-updater: ^6.0.0

  # 测试与生成
  jsdom: ^31.0.0
  vitest: ^3.0.0
  '@swc/core': ^1.16.0
  unplugin-swc: ^2.0.0
  supertest: ^7.0.0
  '@types/supertest': ^7.0.0
  '@playwright/test': ^1.50.0
  orval: ^7.0.0

minimumReleaseAgeExclude:
  - jsdom@31.0.0
