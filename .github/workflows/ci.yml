name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 生成的 Prisma Client 不进版本库，typecheck / build 前必须先产出来
      - name: 生成 Prisma Client
        if: hashFiles('server/prisma/schema.prisma') != ''
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/tongpin_test
        run: pnpm --filter @tongpin/server db:generate

      # 根脚本内部是 `pnpm -r --if-present`：M0 还没有任何包带 build 脚本，
      # 直接写 `pnpm -r build` 会以 ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT 失败
      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 单测
        run: pnpm test

      - name: 构建
        run: pnpm build

      # server 在 M1 才落地；schema 出现后这一步自动生效，不用再改 workflow
      - name: Prisma schema 校验
        if: hashFiles('server/prisma/schema.prisma') != ''
        run: pnpm --filter @tongpin/server exec prisma validate

      - name: 卡口：前端产物体积（O18）
        run: node scripts/check-bundle-size.mjs

      - name: 卡口：app-core 平台边界
        run: bash scripts/check-boundaries.sh

  smoke:
    name: API 冒烟（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: tongpin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:123456@127.0.0.1:5432/tongpin
      NODE_ENV: test
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      AUTH_AUTO_REGISTER: 'true'
      PUBLIC_API_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 迁移与种子数据
        run: |
          pnpm --filter @tongpin/server db:deploy
          pnpm --filter @tongpin/server db:seed

      - name: 构建并启动 API
        run: |
          pnpm --filter @tongpin/server build
          node server/dist/apps/api/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1

      - name: API 冒烟
        run: pnpm test:e2e

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: UI 冒烟（登录 → 入会 → 签到 → 结束）
        run: pnpm test:e2e:ui

      - name: 失败时打印 API 日志
        if: failure()
        run: cat /tmp/api.log
