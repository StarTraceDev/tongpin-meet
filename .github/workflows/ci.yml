name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 根脚本内部是 `pnpm -r --if-present`：M0 还没有任何包带 build 脚本，
      # 直接写 `pnpm -r build` 会以 ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT 失败
      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 单测
        run: pnpm test

      - name: 构建
        run: pnpm build

      # server 在 M1 才落地；schema 出现后这一步自动生效，不用再改 workflow
      - name: Prisma schema 校验
        if: hashFiles('server/prisma/schema.prisma') != ''
        run: pnpm --filter @tongpin/server exec prisma validate

      - name: 卡口：app-core 不许出现平台 API
        run: |
          set -euo pipefail
          if [ -d packages/app-core ]; then
            if grep -rnE "window\.api|window\.electron|isElectron" packages/app-core --exclude-dir=node_modules; then
              echo "::error::packages/app-core 里出现了平台 API，必须走 @tongpin/platform"
              exit 1
            fi
            if grep -rnE "from ['\"]electron['\"]" packages/app-core --exclude-dir=node_modules; then
              echo "::error::packages/app-core 不许 import electron"
              exit 1
            fi
          fi
          echo "app-core 卡口通过"
