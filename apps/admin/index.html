<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同频会议 · 管理后台</title>
    <!-- 防闪烁（05 §7.3）：早于任何 CSS/JS 执行，内容与 web 入口完全一致 -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('tongpin:theme') || 'system'
          var d =
            m === 'dark' ||
            (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = d ? 'dark' : 'light'
          if (d) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 入口脚本在对应里程碑接入（M8 admin / M10 desktop） -->
  </body>
</html>
